# Optional third layer: load invoiceops-mlflow/compose.yml and stack compose.yml first.
services:
  mlflow:
    # Local contention tolerance only; keep the inherited command and probe.
    healthcheck:
      start_period: 330s

  model-api:
    build:
      context: ../invoiceops-model-api
      dockerfile: Dockerfile
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: ${STACK_MODEL_API_MLFLOW_USERNAME:?Set STACK_MODEL_API_MLFLOW_USERNAME in the operator environment}
      MLFLOW_TRACKING_PASSWORD: ${STACK_MODEL_API_MLFLOW_PASSWORD:?Set STACK_MODEL_API_MLFLOW_PASSWORD in the operator environment}
      MODEL_API_ADMIN_TOKEN: ${MODEL_API_ADMIN_TOKEN:?Set MODEL_API_ADMIN_TOKEN in the operator environment}
      # The isolated loader includes cold MLflow/sklearn imports on local Docker.
      MODEL_REFRESH_TIMEOUT_SECONDS: "120"
      MODEL_STARTUP_TIMEOUT_SECONDS: "180"
    ports:
      - "127.0.0.1:${STACK_MODEL_API_PORT:-5800}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/models/invoice-review/health', timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 331s
