name: invoiceops-stack

# Overlay only: load invoiceops-mlflow/compose.yml first.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${STACK_POSTGRES_PASSWORD:?Set STACK_POSTGRES_PASSWORD in the operator environment}

  minio:
    environment:
      MINIO_ROOT_USER: ${STACK_MINIO_ROOT_USER:?Set STACK_MINIO_ROOT_USER in the operator environment}
      MINIO_ROOT_PASSWORD: ${STACK_MINIO_ROOT_PASSWORD:?Set STACK_MINIO_ROOT_PASSWORD in the operator environment}

  minio-init:
    environment:
      MINIO_ROOT_USER: ${STACK_MINIO_ROOT_USER:?Set STACK_MINIO_ROOT_USER in the operator environment}
      MINIO_ROOT_PASSWORD: ${STACK_MINIO_ROOT_PASSWORD:?Set STACK_MINIO_ROOT_PASSWORD in the operator environment}

  mlflow:
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow:5000,127.0.0.1:5000,127.0.0.1:${STACK_MLFLOW_PORT:-5000}"
      AWS_ACCESS_KEY_ID: ${STACK_MINIO_ROOT_USER:?Set STACK_MINIO_ROOT_USER in the operator environment}
      AWS_SECRET_ACCESS_KEY: ${STACK_MINIO_ROOT_PASSWORD:?Set STACK_MINIO_ROOT_PASSWORD in the operator environment}
      MLFLOW_AUTH_DATABASE_URI: postgresql+psycopg2://mlflow:${STACK_POSTGRES_PASSWORD:?Set STACK_POSTGRES_PASSWORD in the operator environment}@postgres:5432/mlflow
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${STACK_POSTGRES_PASSWORD:?Set STACK_POSTGRES_PASSWORD in the operator environment}@postgres:5432/mlflow
    ports: !override
      - "127.0.0.1:${STACK_MLFLOW_PORT:-5000}:5000"
